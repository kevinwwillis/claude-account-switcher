name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: LevelDB for the sidebar sync
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libleveldb-dev
      - run: go vet ./...
      - run: go test ./...
